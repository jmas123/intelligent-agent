[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadline-agent"
version = "0.1.0"
description = "Local-first deadline intelligence agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "ollama>=0.4",
    "anthropic>=0.42",
    "rumps>=0.4",
    "icalendar>=6.0",
    "click>=8.0",
    "watchdog>=4.0",
    "pywebview>=5.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pynput>=1.7",
]

[project.scripts]
deadline-agent = "deadline_agent.cli:cli"
deadline-agent-menubar = "deadline_agent.ui.app:run_menubar"
deadline-agent-widget = "deadline_agent.ui.app:run_widget"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "icalendar.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rumps.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "watchdog.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deadline_agent.ui.menubar"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "deadline_agent.ingestion.moodle"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "webview.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pynput.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "AppKit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "objc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deadline_agent.ui.widget.statusbar"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "deadline_agent.ui.widget.window"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
