<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="widget">
    <!-- Header -->
    <div id="header">
      <span id="header-title">Deadline Agent</span>
      <div id="header-controls">
        <button id="btn-refresh" title="Refresh" onclick="refreshCurrentTab()">&#x21bb;</button>
        <button id="btn-minimize" title="Hide (Cmd+Shift+D)" onclick="pywebview.api.hide_window && window.close()">&#x2715;</button>
      </div>
    </div>

    <!-- Tab bar -->
    <div id="tabs">
      <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <span class="tab-icon">&#x1f4cb;</span>
        <span class="tab-label">Tasks</span>
      </button>
      <button class="tab" data-tab="chat" onclick="switchTab('chat')">
        <span class="tab-icon">&#x1f4ac;</span>
        <span class="tab-label">Chat</span>
      </button>
      <button class="tab" data-tab="insights" onclick="switchTab('insights')">
        <span class="tab-icon">&#x1f4a1;</span>
        <span class="tab-label">Insights</span>
      </button>
      <button class="tab" data-tab="actions" onclick="switchTab('actions')">
        <span class="tab-icon">&#x1f4c5;</span>
        <span class="tab-label">Actions</span>
      </button>
      <div class="tab-more-wrap">
        <button class="tab" id="tab-more-btn" onclick="toggleMoreMenu()">
          <span class="tab-icon">&#x22ef;</span>
          <span class="tab-label">More</span>
        </button>
        <div class="tab-more-menu" id="tab-more-menu">
          <button class="tab-more-item" data-tab="digest" onclick="switchTab('digest');closeMoreMenu()">&#x2600; Digest</button>
          <button class="tab-more-item" data-tab="patterns" onclick="switchTab('patterns');closeMoreMenu()">&#x1f9e0; Patterns</button>
          <button class="tab-more-item" data-tab="affects" onclick="switchTab('affects');closeMoreMenu()">&#x2764; Affects</button>
          <button class="tab-more-item" data-tab="recruiting" onclick="switchTab('recruiting');closeMoreMenu()">&#x1f4bc; Pipeline</button>
          <button class="tab-more-item" data-tab="goals" onclick="switchTab('goals');closeMoreMenu()">&#x1f3af; Goals</button>
          <button class="tab-more-item" data-tab="decisions" onclick="switchTab('decisions');closeMoreMenu()">&#x2696; Decisions</button>
          <button class="tab-more-item" data-tab="relationships" onclick="switchTab('relationships');closeMoreMenu()">&#x1f465; People</button>
          <button class="tab-more-item" data-tab="me" onclick="switchTab('me');closeMoreMenu()">&#x1f9ec; Me</button>
        </div>
      </div>
    </div>

    <!-- Content panels -->
    <div id="content">
      <!-- Dashboard -->
      <div id="panel-dashboard" class="panel active">
        <div id="dashboard-loading" class="loading">Loading tasks...</div>
        <div id="dashboard-content"></div>
      </div>

      <!-- Chat -->
      <div id="panel-chat" class="panel">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ask about your deadlines..."
                 onkeydown="if(event.key==='Enter')sendChat()">
          <button id="voice-btn" class="voice-btn" onclick="toggleVoice()" title="Voice input">&#x1f3a4;</button>
          <button id="chat-send" onclick="sendChat()">&#x27a4;</button>
        </div>
      </div>

      <!-- Insights -->
      <div id="panel-insights" class="panel">
        <div id="insights-loading" class="loading">Loading insights...</div>
        <div id="insights-content"></div>
      </div>

      <!-- Actions -->
      <div id="panel-actions" class="panel">
        <div id="actions-loading" class="loading">Loading actions...</div>
        <div id="actions-content"></div>
      </div>

      <!-- Digest -->
      <div id="panel-digest" class="panel">
        <div id="digest-loading" class="loading">Loading digest...</div>
        <div id="digest-content"></div>
      </div>

      <!-- Patterns -->
      <div id="panel-patterns" class="panel">
        <div id="patterns-loading" class="loading">Loading patterns...</div>
        <div id="patterns-content"></div>
      </div>

      <!-- Affects -->
      <div id="panel-affects" class="panel">
      </div>

      <!-- Recruiting Pipeline -->
      <div id="panel-recruiting" class="panel">
        <div id="recruiting-loading" class="loading">Loading pipeline...</div>
        <div id="recruiting-content"></div>
      </div>

      <!-- Goals -->
      <div id="panel-goals" class="panel">
        <div id="goals-loading" class="loading">Loading goals...</div>
        <div id="goals-content"></div>
      </div>

      <!-- Decisions -->
      <div id="panel-decisions" class="panel">
        <div id="decisions-loading" class="loading">Loading decisions...</div>
        <div id="decisions-content"></div>
      </div>

      <!-- Relationships -->
      <div id="panel-relationships" class="panel">
        <div id="relationships-loading" class="loading">Loading relationships...</div>
        <div id="relationships-content"></div>
      </div>

      <!-- Me (Identity + Knowledge Graph) -->
      <div id="panel-me" class="panel">
        <div id="me-loading" class="loading">Loading...</div>
        <div id="me-content"></div>
      </div>
    </div>

    <!-- Connection status -->
    <div id="status-bar">
      <span id="connection-status">Connecting...</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
